<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Logotipo para aplicación de gastos compartidos</title>
  <desc id="logo-desc">Dos trazos circulares enlazados rodean un signo igual, representando reparto, equilibrio y colaboración.</desc>

  <defs>
    <linearGradient id="background" x1="82" y1="58" x2="430" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f2147"/>
      <stop offset="1" stop-color="#171521"/>
    </linearGradient>
    <linearGradient id="share-a" x1="132" y1="146" x2="380" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9edf0"/>
      <stop offset="1" stop-color="#cbe4f4"/>
    </linearGradient>
    <linearGradient id="share-b" x1="128" y1="248" x2="380" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8def8"/>
      <stop offset="1" stop-color="#c9c2f0"/>
    </linearGradient>
    <linearGradient id="balance" x1="198" y1="220" x2="316" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#fffdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(372 126) rotate(132) scale(314)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cbe4f4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cbe4f4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="68" y="76" width="376" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity="0.34"/>
    </filter>
    <filter id="soft-shadow" x="180" y="194" width="152" height="126" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020817" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Rounded app-icon field -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#background)"/>
  <rect x="20.75" y="20.75" width="470.5" height="470.5" rx="117.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#glow)"/>

  <!-- Two complementary flows create one shared pool -->
  <g filter="url(#shadow)">
    <path d="M128 248C128 176.2 183.1 120 254 120C327.2 120 384 178.3 384 252" fill="none" stroke="url(#share-a)" stroke-width="52" stroke-linecap="round"/>
    <path d="M384 264C384 335.8 328.9 392 258 392C184.8 392 128 333.7 128 260" fill="none" stroke="url(#share-b)" stroke-width="52" stroke-linecap="round"/>
  </g>

  <!-- Balance/equal-share sign -->
  <g filter="url(#soft-shadow)" fill="url(#balance)">
    <rect x="200" y="218" width="112" height="28" rx="14"/>
    <rect x="200" y="266" width="112" height="28" rx="14"/>
  </g>

  <!-- Small highlights preserve clarity at app-icon sizes -->
  <circle cx="119" cy="230" r="8" fill="#d9edf0" fill-opacity="0.72"/>
  <circle cx="393" cy="282" r="8" fill="#e8def8" fill-opacity="0.68"/>
</svg>
